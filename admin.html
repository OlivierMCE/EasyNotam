<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>EasyBrief · Administration</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="auth-config.js"></script>
<style>
:root{--bg:#F4F5F7;--card:#fff;--ink:#0B1220;--sub:#5B6577;--sep:#E4E7EC;--blue:#1747E8;--fill:#EEF0F4;--red:#B4232C;--ok:#0B7A55;--ease:cubic-bezier(.22,1,.36,1)}
@media (prefers-color-scheme:dark){:root{--bg:#0A0F1A;--card:#121A29;--ink:#F3F5F8;--sub:#98A2B3;--sep:rgba(255,255,255,.09);--blue:#5B86FF;--fill:#1A2436;--red:#FF6B73;--ok:#4CD39A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,-apple-system,sans-serif;padding:24px max(16px,env(safe-area-inset-left)) 60px}
.w{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font:700 34px/1.05 'Inter Tight',Inter,sans-serif;letter-spacing:-.03em}
h2{margin:0;font:600 11px Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--sub)}
.sub{color:var(--sub);font-size:14px;margin:4px 0 0}
.card{background:var(--card);border:1px solid var(--sep);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;animation:rise .7s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
input{height:46px;border-radius:12px;border:1px solid var(--sep);background:var(--bg);color:var(--ink);font:400 16px Inter,sans-serif;padding:0 14px;outline:0;width:100%}
input:focus{border-color:var(--blue)}
button{font:600 13.5px Inter,sans-serif;cursor:pointer;border-radius:10px;border:1px solid var(--sep);background:var(--card);color:var(--ink);height:38px;padding:0 14px;transition:transform .25s var(--ease)}
button:active{transform:scale(.97)}
button.p{background:var(--ink);color:var(--bg);border:0;height:46px;border-radius:12px}
button.d{color:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.l{display:flex;flex-direction:column;gap:10px}
.it{border:1px solid var(--sep);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.mono{font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:.04em}
.tag{font:600 11.5px Inter,sans-serif;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--sub)}
.tag.ok{background:rgba(11,122,85,.14);color:var(--ok)}.tag.ko{background:rgba(180,35,44,.12);color:var(--red)}
.msg{font-size:13.5px;color:var(--red);min-height:18px}.msg.ok{color:var(--ok)}
.dev{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;color:var(--sub)}
.dev button{height:30px;font-size:12.5px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="w">
  <div><h1>Administration</h1><p class="sub">Invitations, comptes et appareils d’EasyBrief.</p></div>

  <div class="card" id="vue-login">
    <h2>Connexion administrateur</h2>
    <input id="a-mail" type="email" placeholder="E-mail administrateur" autocomplete="username">
    <input id="a-mdp" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <div class="msg" id="a-msg"></div>
    <button class="p" id="a-go" type="button">Se connecter</button>
  </div>

  <div id="vue-admin" class="w" hidden style="max-width:none">
    <div class="card">
      <h2>Nouvelle invitation</h2>
      <div class="row"><input id="i-nom" placeholder="Pour qui ? (ex. Paul Martin)" style="flex:1;min-width:200px"><button class="p" id="i-go" type="button" style="width:auto;padding:0 20px">Créer le code</button></div>
      <div class="msg" id="i-msg"></div>
      <div class="l" id="i-liste"></div>
    </div>
    <div class="card">
      <h2>Comptes</h2>
      <div class="l" id="u-liste"></div>
    </div>
    <div class="row"><span class="sub" id="a-qui"></span><button type="button" id="a-sortie">Se déconnecter</button></div>
  </div>
</div>

<script type="module">
const CFG = window.EB_AUTH && window.EB_AUTH.firebase, $ = id => document.getElementById(id);
const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
if (!CFG || !CFG.apiKey) { $('a-msg').textContent = 'Les comptes ne sont pas encore configurés (auth-config.js).'; }
else {
  const [app, A, F] = await Promise.all([import(V + 'firebase-app.js'), import(V + 'firebase-auth.js'), import(V + 'firebase-firestore.js')]);
  const a = app.initializeApp(CFG), auth = A.getAuth(a), db = F.getFirestore(a);
  const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const date = t => t ? new Date(t).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
  const appUrl = location.href.replace(/admin\.html.*$/, '');

  async function charger() {
    try {
      const [inv, usr] = await Promise.all([F.getDocs(F.collection(db, 'invites')), F.getDocs(F.collection(db, 'users'))]);
      $('vue-login').hidden = true; $('vue-admin').hidden = false; $('a-qui').textContent = auth.currentUser.email;
      // le compte administrateur peut aussi utiliser l'appli : on l'enregistre comme compte autorisé s'il ne l'est pas encore
      const moi = F.doc(db, 'users', auth.currentUser.uid);
      if (!(await F.getDoc(moi)).exists()) { await F.setDoc(moi, { email: auth.currentUser.email, actif: true, code: 'ADMIN', created: Date.now(), devices: {} }); charger(); return; }
      const invs = inv.docs.map(d => ({ id: d.id, ...d.data() })).sort((x, y) => (y.created || 0) - (x.created || 0));
      $('i-liste').innerHTML = invs.length ? invs.map(i => `<div class="it"><div class="top"><span class="mono">${esc(i.id)}</span>
        <span class="tag ${i.used ? 'ko' : 'ok'}">${i.used ? 'utilisé' : 'disponible'}</span></div>
        <div class="dev"><span>${esc(i.label || '')} · ${date(i.created)}</span>
        <span>${i.used ? '' : `<button data-copie="${esc(i.id)}">Copier le message</button> `}<button class="d" data-supp-inv="${esc(i.id)}">Supprimer</button></span></div></div>`).join('')
        : '<span class="sub">Aucune invitation.</span>';
      const us = usr.docs.map(d => ({ id: d.id, ...d.data() })).sort((x, y) => (x.email || '').localeCompare(y.email || ''));
      $('u-liste').innerHTML = us.length ? us.map(u => { const dv = Object.entries(u.devices || {});
        return `<div class="it"><div class="top"><b>${esc(u.email)}</b><span class="tag ${u.actif === false ? 'ko' : 'ok'}">${u.actif === false ? 'suspendu' : 'actif'}</span></div>
        <span class="sub" style="margin:0">Créé le ${date(u.created)} · ${dv.length} appareil${dv.length > 1 ? 's' : ''}</span>
        ${dv.map(([k, v]) => `<div class="dev"><span>${esc(v.nom)} · ajouté le ${date(v.ajout)}</span><button data-lib="${esc(u.id)}|${esc(k)}">Libérer</button></div>`).join('')}
        <div class="row"><button data-susp="${esc(u.id)}|${u.actif === false ? 1 : 0}">${u.actif === false ? 'Réactiver' : 'Suspendre'}</button>
        ${dv.length ? `<button data-libtout="${esc(u.id)}">Libérer tous les appareils</button>` : ''}
        <button class="d" data-supp-usr="${esc(u.id)}">Supprimer le compte</button></div></div>`; }).join('')
        : '<span class="sub">Aucun compte pour le moment.</span>';
    } catch (e) {
      $('a-msg').textContent = 'Ce compte n’est pas administrateur (ou les règles Firestore ne sont pas publiées).';
      await A.signOut(auth); $('vue-login').hidden = false; $('vue-admin').hidden = true;
    }
  }
  A.onAuthStateChanged(auth, u => { if (u) charger(); });
  $('a-go').onclick = async () => {
    $('a-msg').textContent = '';
    try { await A.signInWithEmailAndPassword(auth, $('a-mail').value.trim(), $('a-mdp').value); } catch (e) { $('a-msg').textContent = 'E-mail ou mot de passe incorrect.'; }
  };
  $('a-sortie').onclick = () => A.signOut(auth).then(() => { $('vue-login').hidden = false; $('vue-admin').hidden = true; });

  const code = () => { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = crypto.getRandomValues(new Uint8Array(8)); const s = [...r].map(x => c[x % c.length]).join(''); return s.slice(0, 4) + '-' + s.slice(4); };
  $('i-go').onclick = async () => {
    const nom = $('i-nom').value.trim(), c = code();
    await F.setDoc(F.doc(db, 'invites', c), { used: false, label: nom, created: Date.now() });
    $('i-nom').value = ''; $('i-msg').className = 'msg ok'; $('i-msg').textContent = 'Code créé : ' + c; charger();
  };
  document.addEventListener('click', async ev => {
    const b = ev.target.closest('button'); if (!b) return;
    const d = b.dataset;
    if (d.copie) {
      const txt = `Bonjour, voici ton accès à EasyBrief : ${appUrl}\nCrée ton compte (onglet « Créer un compte ») avec ton e-mail, un mot de passe et ce code d’invitation : ${d.copie}`;
      try { await navigator.clipboard.writeText(txt); b.textContent = 'Copié ✓'; } catch (e) { prompt('Copie ce message :', txt); }
    } else if (d.suppInv) { if (confirm('Supprimer cette invitation ?')) { await F.deleteDoc(F.doc(db, 'invites', d.suppInv)); charger(); } }
    else if (d.suppUsr) { if (confirm('Supprimer ce compte ? La personne perdra l’accès immédiatement.')) { await F.deleteDoc(F.doc(db, 'users', d.suppUsr)); charger(); } }
    else if (d.susp) { const [id, react] = d.susp.split('|'); await F.updateDoc(F.doc(db, 'users', id), { actif: react === '1' }); charger(); }
    else if (d.lib) { const [id, k] = d.lib.split('|'); await F.updateDoc(F.doc(db, 'users', id), { ['devices.' + k]: F.deleteField() }); charger(); }
    else if (d.libtout) { await F.updateDoc(F.doc(db, 'users', d.libtout), { devices: {} }); charger(); }
  });
}
</script>
</body>
</html>
